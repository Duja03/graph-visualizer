{% load static %}
<style>
    .node-header {
        fill: var(--violet-700);
        stroke: #fff;
        stroke-width: 1;
    }
    .node_property {
        fill: var(--violet-600);
        stroke: #fff;
        stroke-width: 0.5;
    }
    .link.connected {
        stroke: var(--violet-600);
        stroke-width: 3;
    }
    .link {
        stroke: var(--violet-300);
        stroke-opacity: 0.6;
        stroke-width: 1;
    }
    .label {
        fill: white;
        font-family: Arial, sans-serif;
        font-size: 0.6em;
        text-anchor: middle;
        pointer-events: none;
    }
    .property_label {
        fill: white;
        font-family: Arial, sans-serif;
        font-size: 0.5em;
        text-anchor: middle;
        pointer-events: none;
    }
    .node-group { cursor: grab; }
    .node-group:active { cursor: grabbing; }
    .simple-svg-container, .container-simple {
        width: 100%;
        height: 100%;
    }
</style>

<div class="simple-svg-container">
    <svg id="container-simple" class="container-simple"></svg>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
    var graphData = {{ graph_json | safe }};
    var NODE_W = 100;
    var ROW_H  = 20;

    var svg = d3.select(".container-simple");
    var zoomG = svg.append("g").attr("class", "zoom-layer");

    var simulation = d3.forceSimulation()
        .nodes(graphData.nodes)
        .force("link", d3.forceLink(graphData.edges).id(function(d) { return d.id; }).distance(160))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(400, 300))
        .force("collide", d3.forceCollide().radius(80).iterations(5));

    var link = zoomG
        .selectAll(".link")
        .data(graphData.edges)
        .enter().append("line")
        .attr("class", "link");

    var nodeGroup = zoomG
        .selectAll(".node-group")
        .data(graphData.nodes)
        .enter().append("g")
        .attr("class", "node-group")
        .on("click", function(event, d) {
            var idx = d.index;
            link.attr("class", function(l) {
                return (l.source.index === idx || l.target.index === idx) ? "link connected" : "link";
            });
        })
        .call(
            d3.drag()
                .on("start", dragstarted)
                .on("drag",  dragged)
                .on("end",   dragended)
        );

    nodeGroup.each(function(d) {
        var g = d3.select(this);
        var props = Object.entries(d.attributes || {});

        g.append("rect")
            .attr("class", "node-header")
            .attr("width",  NODE_W)
            .attr("height", ROW_H)
            .attr("x", -NODE_W / 2)
            .attr("y", -ROW_H / 2);

        g.append("text")
            .attr("class", "label")
            .attr("x", 0)
            .attr("y", ROW_H / 2 - 6)
            .text(d.id);

        props.forEach(function(entry, i) {
            var key = entry[0], val = entry[1];
            var rowY = ROW_H / 2 + i * ROW_H;

            g.append("rect")
                .attr("class", "node_property")
                .attr("width",  NODE_W)
                .attr("height", ROW_H)
                .attr("x", -NODE_W / 2)
                .attr("y", rowY);

            g.append("text")
                .attr("class", "property_label")
                .attr("x", 0)
                .attr("y", rowY + ROW_H / 2 + 4)
                .text(key + ": " + val);
        });
    });

    simulation.on("tick", function() {
        link
            .attr("x1", function(d) { return d.source.x; })
            .attr("y1", function(d) { return d.source.y; })
            .attr("x2", function(d) { return d.target.x; })
            .attr("y2", function(d) { return d.target.y; });
        nodeGroup.attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; });

        // Always broadcast positions so bird view tracks node movement
        window.dispatchEvent(new CustomEvent("visualizer:positions", {
            detail: { nodes: graphData.nodes }
        }));
    });

    var zoom = d3.zoom()
        .scaleExtent([0.1, 10])
        .on("zoom", function(event) {
            zoomG.attr("transform", event.transform);

            // Broadcast zoom/pan transform to bird view
            var svgEl = svg.node();
            window.dispatchEvent(new CustomEvent("visualizer:zoom", {
                detail: {
                    transform: {
                        x: event.transform.x,
                        y: event.transform.y,
                        k: event.transform.k
                    },
                    mainW: svgEl.clientWidth  || svgEl.getBoundingClientRect().width,
                    mainH: svgEl.clientHeight || svgEl.getBoundingClientRect().height
                }
            }));
        });

    svg.call(zoom);

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) {
        d.fx = event.x; d.fy = event.y;
    }
    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
        // Emit final positions after drag, in case simulation already stopped
        window.dispatchEvent(new CustomEvent("visualizer:positions", {
            detail: { nodes: graphData.nodes }
        }));
    }

    // Expose simulation node positions for bird view initial draw
    window.__mainSimNodes = graphData.nodes;
})();
</script>
