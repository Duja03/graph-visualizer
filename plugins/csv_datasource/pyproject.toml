[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-datasource"
version = "1.0.0"
description = "CSV data source plugin for Graph Explorer"
requires-python = ">=3.11"
dependencies = [
    "api",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["csv_datasource*"]

[project.entry-points."graph_explorer.datasource_plugins"]
csv_datasource = "csv_datasource:CsvDataSourcePlugin"