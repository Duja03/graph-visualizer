{% load static %}
<style>
    .node-group circle {
        fill: #7c3aed;
        stroke: white;
        stroke-width: 2;
        cursor: grab;
    }
    .node-group:active { cursor: grabbing; }
    .node-group circle:hover { fill: #5b21b6; }
    .link {
        stroke: #c4b5fd;
        stroke-opacity: 0.6;
        stroke-width: 1.5;
    }
    .link.connected {
        stroke: #7c3aed;
        stroke-width: 3;
    }
    .label {
        fill: #374151;
        font-family: Arial, sans-serif;
        font-size: 0.65em;
        text-anchor: middle;
        pointer-events: none;
    }
    .simple-svg-container, .container-simple {
        width: 100%;
        height: 100%;
    }
</style>

<div class="simple-svg-container">
    <svg id="container-simple" class="container-simple"></svg>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
    var graphData = {{ graph_json | safe }};

    var COLOR_DEFAULT  = "#7c3aed";
    var COLOR_FOCUSED  = "#3b0764";
    var STROKE_DEFAULT = "white";
    var STROKE_FOCUSED = "#e9d5ff";
    var RADIUS_DEFAULT = 20;
    var RADIUS_FOCUSED = 25;

    // ── Main View ────────────────────────────────────────────────────────────

    var mainSvg   = d3.select("#container-simple");
    var mainZoomG = mainSvg.append("g").attr("class", "zoom-layer");

    var simulation = d3.forceSimulation()
        .nodes(graphData.nodes)
        .force("link", d3.forceLink(graphData.edges).id(function(d) { return d.id; }).distance(100))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(400, 300))
        .force("collide", d3.forceCollide().radius(30).iterations(3));

    var mainLink = mainZoomG
        .selectAll(".link")
        .data(graphData.edges)
        .enter().append("line")
        .attr("class", "link");

    var mainNodeGroup = mainZoomG
        .selectAll(".node-group")
        .data(graphData.nodes)
        .enter().append("g")
        .attr("class", "node-group")
        .on("click", function(event, d) {
            event.stopPropagation();
            window.focusNode(d.id);
        })
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag",  dragged)
            .on("end",   dragended)
        );

    // Keep references to circle elements for direct attribute manipulation
    mainNodeGroup.each(function(d) {
        var g = d3.select(this);
        g.append("circle").attr("r", RADIUS_DEFAULT);
        g.append("text").attr("class", "label").attr("y", 35).text(d.id);
    });

    // ── Bird View ────────────────────────────────────────────────────────────

    var birdSvg = d3.select("#bird-canvas");
    var birdLink, birdNode, birdViewport;

    if (!birdSvg.empty()) {
        var birdG = birdSvg.append("g").attr("class", "bird-inner");

        birdLink = birdG
            .selectAll(".bird-link")
            .data(graphData.edges)
            .enter().append("line")
            .attr("stroke", "#c4b5fd")
            .attr("stroke-width", 0.8)
            .attr("stroke-opacity", 0.5);

        birdNode = birdG
            .selectAll(".bird-node")
            .data(graphData.nodes)
            .enter().append("circle")
            .attr("r", 3)
            .attr("fill", "#8b5cf6")
            .attr("opacity", 0.85)
            .style("cursor", "pointer")
            .on("click", function(event, d) {
                event.stopPropagation();
                window.focusNode(d.id);
            });

        var vpEl = document.getElementById("bird-viewport");
        if (vpEl) birdSvg.node().appendChild(vpEl);
        birdViewport = birdSvg.select("#bird-viewport");
    }

    var currentTransform = d3.zoomIdentity;

    function calcBirdFit() {
        var el = birdSvg.node();
        if (!el) return null;
        var bw = el.clientWidth  || el.getBoundingClientRect().width  || 220;
        var bh = el.clientHeight || el.getBoundingClientRect().height || 140;
        var nodes = graphData.nodes;
        if (!nodes.length) return { s: 1, tx: 0, ty: 0 };
        var xs = nodes.map(function(n) { return n.x || 0; });
        var ys = nodes.map(function(n) { return n.y || 0; });
        var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
        var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
        var PAD = 10;
        var s = Math.min((bw - 2*PAD) / ((xMax-xMin)||1), (bh - 2*PAD) / ((yMax-yMin)||1));
        var tx = PAD + ((bw-2*PAD) - (xMax-xMin)*s) / 2 - xMin*s;
        var ty = PAD + ((bh-2*PAD) - (yMax-yMin)*s) / 2 - yMin*s;
        return { s: s, tx: tx, ty: ty, bw: bw, bh: bh };
    }

    function updateBird() {
        if (birdSvg.empty() || !birdNode) return;
        var fit = calcBirdFit();
        if (!fit) return;
        var s = fit.s, tx = fit.tx, ty = fit.ty;

        birdNode
            .attr("cx", function(d) { return (d.x||0)*s + tx; })
            .attr("cy", function(d) { return (d.y||0)*s + ty; });

        birdLink
            .attr("x1", function(d) { return (d.source.x||0)*s + tx; })
            .attr("y1", function(d) { return (d.source.y||0)*s + ty; })
            .attr("x2", function(d) { return (d.target.x||0)*s + tx; })
            .attr("y2", function(d) { return (d.target.y||0)*s + ty; });

        var mainEl = mainSvg.node();
        var mainW = mainEl.clientWidth  || mainEl.getBoundingClientRect().width  || 800;
        var mainH = mainEl.clientHeight || mainEl.getBoundingClientRect().height || 600;
        var k = currentTransform.k, ox = currentTransform.x, oy = currentTransform.y;

        birdViewport
            .attr("x",      ((0-ox)/k)*s + tx)
            .attr("y",      ((0-oy)/k)*s + ty)
            .attr("width",  Math.max(0, (mainW/k)*s))
            .attr("height", Math.max(0, (mainH/k)*s));
    }

    // ── Focus / Selection ────────────────────────────────────────────────────

    function applyFocus(nodeId) {
        // Highlight connected edges
        mainLink.attr("class", function(l) {
            var srcId = l.source.id !== undefined ? l.source.id : l.source;
            var tgtId = l.target.id !== undefined ? l.target.id : l.target;
            return (srcId === nodeId || tgtId === nodeId) ? "link connected" : "link";
        });

        // Main view — directly set fill/stroke/radius on circle elements
        mainNodeGroup.each(function(d) {
            var circle = d3.select(this).select("circle");
            if (d.id === nodeId) {
                circle
                    .attr("fill",         COLOR_FOCUSED)
                    .attr("stroke",       STROKE_FOCUSED)
                    .attr("stroke-width", 3)
                    .attr("r",            RADIUS_FOCUSED);
            } else {
                circle
                    .attr("fill",         COLOR_DEFAULT)
                    .attr("stroke",       STROKE_DEFAULT)
                    .attr("stroke-width", 2)
                    .attr("r",            RADIUS_DEFAULT);
            }
        });

        // Bird view — directly set fill/radius
        if (birdNode) {
            birdNode
                .attr("fill", function(d) {
                    return d.id === nodeId ? COLOR_FOCUSED : "#8b5cf6";
                })
                .attr("r", function(d) {
                    return d.id === nodeId ? 5 : 3;
                })
                .attr("opacity", function(d) {
                    return d.id === nodeId ? 1 : 0.85;
                });
        }
    }

    // Listen for focus from tree or bird view clicks
    window.addEventListener("graph:focusNode", function(e) {
        applyFocus(e.detail.nodeId);
    });

    // ── Simulation tick ──────────────────────────────────────────────────────

    simulation.on("tick", function() {
        mainLink
            .attr("x1", function(d) { return d.source.x; })
            .attr("y1", function(d) { return d.source.y; })
            .attr("x2", function(d) { return d.target.x; })
            .attr("y2", function(d) { return d.target.y; });
        mainNodeGroup.attr("transform", function(d) {
            return "translate(" + d.x + "," + d.y + ")";
        });
        updateBird();
    });

    // ── Zoom ─────────────────────────────────────────────────────────────────

    var zoom = d3.zoom()
        .scaleExtent([0.1, 10])
        .on("zoom", function(event) {
            currentTransform = event.transform;
            mainZoomG.attr("transform", event.transform);
            updateBird();
        });

    mainSvg.call(zoom);

    // ── Drag ─────────────────────────────────────────────────────────────────

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) {
        d.fx = event.x; d.fy = event.y;
    }
    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
    }
})();
</script>
