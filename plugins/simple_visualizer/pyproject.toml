[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_visualizer"
version = "1.0.0"
description = "Simple visualizer plugin for Graph Explorer"
requires-python = ">=3.11"
dependencies = [
    "api",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["simple_visualizer*"]

[project.entry-points."graph_explorer.visualizer_plugins"]
simple_visualizer = "simple_visualizer:SimpleVisualizerPlugin"