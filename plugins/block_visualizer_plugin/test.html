<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    :root {
        --violet-50:  #f5f3ff;
        --violet-100: #ede9fe;
        --violet-200: #e2d9f3;
        --violet-300: #c4b5fd;
        --violet-500: #8b5cf6;
        --violet-600: #7c3aed;
        --violet-700: #6d28d9;
        --violet-800: #5b21b6;
        --violet-900: #6b21a8;
        --gray-100:   #f3f4f6;
        --gray-500:   #6b7280;
        --gray-700:   #374151;
        --gray-800:   #4b5563;
    }

    .node-header {
        fill: var(--violet-700);
        stroke: #fff;
        stroke-width: 1;
    }

    .node_property {
        fill: var(--violet-600);
        stroke: #fff;
        stroke-width: 0.5;
    }

    .link.connected {
        stroke: var(--violet-600);
        stroke-width: 3;
    }

    .link {
        stroke: var(--violet-300);
        stroke-opacity: 0.6;
        stroke-width: 1;
    }

    .label {
        fill: white;
        font-family: Arial, sans-serif;
        font-size: 0.6em;
        text-anchor: middle;
        pointer-events: none;
    }

    .property_label {
        fill: white;
        font-family: Arial, sans-serif;
        font-size: 0.5em;
        text-anchor: middle;
        pointer-events: none;
    }

    .node-group {
        cursor: grab;
    }

    .node-group:active {
        cursor: grabbing;
    }

    .simple-svg-container, .container-simple {
        width: 100%;
        min-height: 920px;
        height: 100%;
    }
</style>
<body>
<!--{% load static %}-->
<div class="simple-svg-container">
    <svg id="container-simple" class="container-simple"></svg>
</div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    // var graphData = JSON.parse('{{ graph_json | safe }}');
    var graphData = {
      "nodes": [
        {
          "id": "company_1",
          "attributes": {
            "name": "GraphSoft",
            "founded": "2015-03-10"
          }
        },
        {
          "id": "emp_1",
          "attributes": {
            "name": "Sara",
            "age": 23,
            "salary": "3500.5"
          }
        },
        {
          "id": "emp_2",
          "attributes": {
            "name": "Marko",
            "age": 30
          }
        },
        {
          "id": "emp_3",
          "attributes": {
            "name": "Luka",
            "age": 40
          }
        },
        {
          "id": "dep_1",
          "attributes": {
            "name": "Engineering"
          }
        }
      ],
      "edges": [
        { "id": "company_1_emp_1", "source": "company_1", "target": "emp_1", "value": {"relation": "employees"} },
        { "id": "company_1_emp_2", "source": "company_1", "target": "emp_2", "value": {"relation": "employees"} },
        { "id": "company_1_emp_3", "source": "company_1", "target": "emp_3", "value": {"relation": "employees"} },
        { "id": "emp_1_emp_3",     "source": "emp_1",     "target": "emp_3", "value": {"relation": "manager"} },
        { "id": "emp_2_emp_3",     "source": "emp_2",     "target": "emp_3", "value": {"relation": "manager"} },
        { "id": "emp_3_dep_1",     "source": "emp_3",     "target": "dep_1", "value": {"relation": "department"} },
        { "id": "company_1_dep_1", "source": "company_1", "target": "dep_1", "value": {"relation": "main_department"} }
      ]
    };

    var NODE_W = 100;
    var ROW_H  = 20;

    var svg = d3.select(".container-simple");

    // A single <g> that receives all zoom/pan transforms
    var zoomG = svg.append("g").attr("class", "zoom-layer");

    var simulation = d3.forceSimulation()
        .nodes(graphData.nodes)
        .force("link", d3.forceLink(graphData.edges).id(d => d.id).distance(160))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(400, 300))
        .force("collide", d3.forceCollide().radius(80).iterations(5));

    // ── Links ──────────────────────────────────────────────────────────────────
    var link = zoomG
        .selectAll(".link")
        .data(graphData.edges)
        .enter().append("line")
        .attr("class", "link");

    // ── Node groups ────────────────────────────────────────────────────────────
    var nodeGroup = zoomG
        .selectAll(".node-group")
        .data(graphData.nodes)
        .enter().append("g")
        .attr("class", "node-group")
        .on("click", function(event, d) {
            var idx = d.index;
            link.attr("class", l =>
                (l.source.index === idx || l.target.index === idx) ? "link connected" : "link"
            );
        })
        .call(
            d3.drag()
                .on("start", dragstarted)
                .on("drag",  dragged)
                .on("end",   dragended)
        );

    // For each node group, append header rect + header label + property rows
    nodeGroup.each(function(d) {
        var g = d3.select(this);
        var props = Object.entries(d.attributes);

        // Header rect (the "node" title bar)
        g.append("rect")
            .attr("class", "node-header")
            .attr("width",  NODE_W)
            .attr("height", ROW_H)
            .attr("x", -NODE_W / 2)
            .attr("y", -ROW_H / 2);

        // Header label (node id)
        g.append("text")
            .attr("class", "label")
            .attr("x", 0)
            .attr("y", ROW_H / 2 - 6)
            .text(d.id);

        // Property rows below the header
        props.forEach(function([key, val], i) {
            var rowY = ROW_H / 2 + i * ROW_H; // starts just below header

            g.append("rect")
                .attr("class", "node_property")
                .attr("width",  NODE_W)
                .attr("height", ROW_H)
                .attr("x", -NODE_W / 2)
                .attr("y", rowY);

            g.append("text")
                .attr("class", "property_label")
                .attr("x", 0)
                .attr("y", rowY + ROW_H / 2 + 4)
                .text(key + ": " + val);
        });
    });

    // ── Simulation tick ────────────────────────────────────────────────────────
    simulation.on("tick", function() {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        // Moving the whole group is all that's needed — children are in local coords
        nodeGroup.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    // ── Zoom / pan ─────────────────────────────────────────────────────────────
    var zoom = d3.zoom()
        .scaleExtent([0.3, 5])
        .on("zoom", function(event) {
            zoomG.attr("transform", event.transform);
        });

    svg.call(zoom);

    // ── Drag handlers ──────────────────────────────────────────────────────────
    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }
</script>
</body>
</html>
