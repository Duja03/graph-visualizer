{% extends "base.html" %}
{% block title_suffix %} - Main View{% endblock %}
{% block content %}

<div style="display:flex;flex-direction:column;flex:1;overflow:hidden;">

    <!-- Toolbar -->
    <div class="toolbar">
        <span class="material-icons" style="color:var(--violet-300);font-size:1.1rem;flex-shrink:0;">tune</span>
        <select id="plugin-selector" class="toolbar-select">
            <option value="">Loading plugins...</option>
        </select>
        <input type="text" id="search-input" class="toolbar-input" placeholder="Search nodes…" style="flex:1;min-width:120px;">
        <input type="text" id="filter-input" class="toolbar-input" placeholder="Filter: Age > 30" style="flex:1;min-width:120px;">
        <button id="btn-search" class="btn">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">search</span>
            Search
        </button>
        <button id="btn-filter" class="btn">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">filter_list</span>
            Filter
        </button>
        <button id="btn-reset" class="btn btn-secondary">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">refresh</span>
            Reset
        </button>
    </div>

    <!-- Three panels row -->
    <div style="display:flex;flex:1;gap:0.75rem;margin:0.75rem 1rem;overflow:hidden;">

        <!-- Main canvas -->
        <div class="view-panel main-panel" style="flex:2;">
            <div class="panel-title">Main View</div>
            <svg id="main-canvas" width="100%" height="100%"></svg>
        </div>

        <!-- Tree panel -->
        <div class="view-panel tree-panel" style="flex:1;">
            <div class="panel-title">Tree View</div>
            <div id="tree-container" style="flex:1;overflow:auto;padding:0.5rem;"></div>
        </div>

        <!-- Bird panel -->
        <div class="view-panel bird-panel" style="flex:1;">
            <div class="panel-title">Bird View</div>
            <svg id="bird-canvas" width="100%" height="100%">
                <rect id="bird-viewport" x="0" y="0" width="50" height="50"
                      style="fill:none;stroke:#7c3aed;stroke-width:1.5;opacity:0.6;"/>
            </svg>
        </div>

    </div>

    <!-- CLI Terminal -->
    <div class="cli-panel">
        <div id="cli-output" class="cli-output"></div>
        <div class="cli-input-row">
            <span class="cli-prompt">graph&gt;</span>
            <input type="text" id="cli-input" class="cli-input"
                   placeholder="create node --id=1 --property Name=Alice">
            <button id="btn-cli-run" class="btn" style="padding:0.35rem 1rem;font-size:0.85rem;">Run</button>
        </div>
    </div>

</div>

{% endblock %}
{% block scripts %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="/static/graph.js"></script>
<script src="/static/tree.js"></script>
<script src="/static/cli.js"></script>
{% endblock %}
