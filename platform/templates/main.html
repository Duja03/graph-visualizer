{% extends "base.html" %}
{% block title_suffix %} - Main View{% endblock %}
{% block content %}

<div style="display:flex;flex-direction:column;flex:1;overflow:hidden;">

    <!-- Toolbar -->
    <div class="toolbar">
        <span class="material-icons" style="color:var(--violet-300);font-size:1.1rem;flex-shrink:0;">tune</span>
        <select id="plugin-selector" class="toolbar-select">
        </select>
        <input type="text" id="search-input" class="toolbar-input" placeholder="Search nodes…" style="flex:1;min-width:120px;">
        <input type="text" id="filter-input" class="toolbar-input" placeholder="Filter: Age > 30" style="flex:1;min-width:120px;">
        <button id="btn-search" class="btn">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">search</span>
            Search
        </button>
        <button id="btn-filter" class="btn">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">filter_list</span>
            Filter
        </button>
        <button id="btn-reset" class="btn btn-secondary">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">refresh</span>
            Reset
        </button>
    </div>

    <!-- Two panels row -->
    <div style="display:flex;flex:1;gap:0.75rem;margin:0.75rem 1rem;overflow:hidden;">

        <!-- Tree panel -->
        <div class="view-panel tree-panel" style="flex:1;">
            <div class="panel-title">Tree View</div>
            <div id="tree-container" style="flex:1;overflow:auto;padding:0.5rem;"></div>
        </div>

        <!-- Main canvas — position:relative so bird view can anchor to it -->
        <div class="view-panel main-panel" style="flex:3;position:relative;">
            <div class="panel-title">Main View</div>
            <div id="main-canvas"></div>
            <div id="visualizer-container" style="flex:1;width:100%;height:100%;"></div>

            <!-- Bird View — overlaid bottom-right corner of Main View -->
            <div class="view-panel bird-panel"
                 style="position:absolute;
                        bottom:12px;
                        right:12px;
                        width: 25%;
                        height: 25%;
                        min-width: 140px;
                        min-height: 100px;
                        flex:none;
                        z-index:10;
                        box-shadow:0 4px 16px rgba(109,40,217,0.18);
                        border-radius:10px;
                        overflow:hidden;
                        opacity:0.95;">
                <div class="panel-title" style="font-size:0.7rem;padding:0.3rem 0.75rem;">Bird View</div>
                <svg id="bird-canvas" width="100%" height="100%" style="display:block;">
                    <rect id="bird-viewport" x="0" y="0" width="50" height="50"
                          style="fill:none;stroke:#7c3aed;stroke-width:1.5;opacity:0.6;"/>
                </svg>
            </div>

        </div>

    </div>

    <!-- CLI Terminal -->
    <div class="cli-panel">
        <div id="cli-output" class="cli-output"></div>
        <div class="cli-input-row">
            <span class="cli-prompt">graph&gt;</span>
            <input type="text" id="cli-input" class="cli-input"
                   placeholder="create node --id=1 --attribute Name=Alice">
            <button id="btn-cli-run" class="btn" style="padding:0.35rem 1rem;font-size:0.85rem;">Run</button>
        </div>
    </div>

</div>

{% endblock %}
{% block scripts %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="/static/graph.js"></script>
<script src="/static/tree.js"></script>
<script src="/static/cli.js"></script>

<!-- ucitaj plugine u toolbar dropdown -->
<script>
    (async () => {
        const plugins = await API.getVisualizerPlugins();
        const selector = document.getElementById('plugin-selector');
        if (plugins.length === 0) {
            selector.innerHTML = '<option value="">No plugins found :(</option>';
        }
        plugins.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            selector.appendChild(opt);
        });

        const saved = State.activeVisualizerPlugin || 'block_visualizer';
        selector.value = saved;
        State.activeVisualizerPlugin = selector.value;

        selector.addEventListener('change', async () => {
            State.activeVisualizerPlugin = selector.value;

            await fetch(`/api/graph/${State.currentWorkspaceId}/visualizer/set`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plugin_id: selector.value }),
            });

            renderGraph(State.currentWorkspaceId);
        });

    })();
</script>
{% endblock %}
