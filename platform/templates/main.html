<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph Visualizer App</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; }

        nav {
            border-bottom: 1px solid #e2d9f3;
            background-color: #f5f3ff; /* bg-violet-50 */
        }
        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo img {
            max-width: 6rem;
            max-height: 8rem;
            height: 100px;
            width: 150px;
        }

        .search-field {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-field input {
            width: 20rem;
            padding: 0.6rem 2.5rem 0.6rem 1rem;
            border: 1px solid #c4b5fd;
            border-radius: 999px;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            outline: none;
            background: white;
            transition: border-color 0.2s;
        }
        .search-field input:focus {
            border-color: #7c3aed;
        }
        .search-field label {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 1rem;
            pointer-events: none;
            transition: 0.2s;
        }
        .search-field input:focus + label,
        .search-field input:not(:placeholder-shown) + label {
            top: -0.5rem;
            font-size: 0.75rem;
            background: white;
            padding: 0 0.25rem;
            color: #7c3aed;
        }
        .search-icon {
            position: absolute;
            right: 0.6rem;
            color: #6b7280;
            font-size: 1.25rem;
            pointer-events: none;
        }

        .toggle-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }
        .toggle-label {
            font-size: 1.125rem;
            color: #374151;
        }
        .toggle-label.active {
            color: #7c3aed;
            font-weight: 500;
        }

        .slide-toggle {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .slide-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #7c3aed;
            border-radius: 24px;
            transition: 0.3s;
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        .slide-toggle input:checked + .slider {
            background-color: #4f46e5;
        }
        .slide-toggle input:checked + .slider::before {
            transform: translateX(24px);
        }

        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .drawer {
            background: #faf9ff;
            border-right: 1px solid #e2d9f3;
            display: flex;
            flex-direction: column;
            transition: width 0.28s cubic-bezier(.4,0,.2,1), padding 0.28s;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .drawer.collapsed { width: 0 !important; padding: 0 !important; border-right: none; }

        .drawer-sources { width: 220px; }
        .drawer-tree    { width: 220px; }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #6b21a8;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-bottom: 1px solid #ede9fe;
            white-space: nowrap;
        }
        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            color: #4b5563;
            white-space: nowrap;
        }
        .drawer-body iframe {
            width: 100%;
            height: calc(100% - 1rem);
            border: 1px solid #ede9fe;
            border-radius: 6px;
            background: white;
        }

        .drawer-toggle-btn {
            position: absolute;
            top: 50%;
            right: -14px;
            transform: translateY(-50%);
            z-index: 10;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #7c3aed;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(124,58,237,0.35);
            transition: background 0.2s;
        }
        .drawer-toggle-btn:hover { background: #6d28d9; }
        .drawer-toggle-btn .material-icons { font-size: 16px; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .filters-bar {
            margin: 1rem;
            padding: 0.75rem 1rem;
            background: white;
            border: 1px solid #e2d9f3;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }
        .filters-bar span {
            font-size: 0.85rem;
            font-weight: 500;
            color: #6b21a8;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .filter-chip {
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            border: 1px solid #c4b5fd;
            background: #f5f3ff;
            font-size: 1rem;
            color: #5b21b6;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .filter-chip:hover, .filter-chip.active {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }

        .view-area {
            flex: 1;
            margin: 1rem 1rem;
            border: 1px solid #e2d9f3;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            position: relative;
        }
        .view-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c4b5fd;
            font-size: 0.9rem;
            flex-direction: column;
            gap: 0.5rem;
        }
        .view-placeholder .material-icons { font-size: 3rem; }

        .minimap {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            width: 180px;
            height: 140px;
            background: white;
            border: 1px solid #e2d9f3;
            border-radius: 1rem;
            box-shadow: 0 4px 16px rgba(124,58,237,0.12);
            padding: 0.5rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .minimap-header {
            font-size: 0.7rem;
            font-weight: 500;
            color: #6b21a8;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #ede9fe;
        }
        .minimap iframe {
            flex: 1;
            width: 100%;
            border: none;
            border-radius: 4px;
            background: #f5f3ff;
        }
        .minimap-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c4b5fd;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <nav>
      <div class="nav-inner">
        <a href="/" class="logo">
          <img src="./assets/logo.svg" alt="logo">
        </a>
        <div class="search-field">
          <input type="text" id="search" placeholder=" " />
          <label for="search">Search anywhere</label>
          <span class="material-icons search-icon">search</span>
        </div>
        <div class="toggle-group">
          <span class="toggle-label active" id="label-simple">Simple View</span>
          <label class="slide-toggle">
            <input type="checkbox" id="view-toggle" onchange="onToggleChange(this)">
            <span class="slider"></span>
          </label>
          <span class="toggle-label" id="label-block">Block View</span>
        </div>
      </div>
    </nav>
    <div class="app-body">
        <div class="drawer drawer-sources" id="drawer-sources">
            <div class="drawer-body">
                <div style="display:flex;flex-direction:column;gap:0.5rem;padding-top:0.25rem;">
                    <div class="filter-chip active" onclick="choose(this)">Database A</div>
                    <div class="filter-chip" onclick="choose(this)">API Endpoint</div>
                    <div class="filter-chip" onclick="choose(this)">CSV File</div>
                    <div class="filter-chip" onclick="choose(this)">GraphQL</div>
                    <div class="filter-chip" onclick="choose(this)">Analytics</div>
                </div>
            </div>
        </div>
        <div class="drawer drawer-tree" id="drawer-tree">
            <div class="view-area">
                <div class="view-placeholder">
                    <span class="material-icons">hub</span>
                    <div>Tree view will render here</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="filters-bar">
                <span>Filters</span>
                <div class="filter-chip active" onclick="setFilter(this)">All</div>
                <div class="filter-chip" onclick="setFilter(this)">Nodes</div>
                <div class="filter-chip" onclick="setFilter(this)">Edges</div>
                <div class="filter-chip" onclick="setFilter(this)">Clusters</div>
            </div>
            <div class="view-area">
                <div class="view-placeholder">
                    <span class="material-icons">hub</span>
                    <div>Graph view will render here</div>
                </div>
            </div>
        </div>
    </div>
    <div class="minimap">
        <div class="minimap-placeholder">map view</div>
    </div>
    <script>
        function onToggleChange(checkbox) {
            const isBlock = checkbox.checked;
            console.log('Toggled to:', isBlock ? 'Block View' : 'Simple View');
            document.getElementById('label-simple').classList.toggle('active', !isBlock);
            document.getElementById('label-block').classList.toggle('active', isBlock);
        }

        function choose(el) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function setFilter(el) {
            document.querySelectorAll('.filters-bar .filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }
    </script>

</body>
</html>
