{% extends "base.html" %}
{% block title_suffix %} - Tree View{% endblock %}
{% block content %}

<div style="display:flex;flex-direction:column;flex:1;overflow:hidden;">

    <!-- Toolbar -->
    <div class="toolbar">
        <span class="material-icons" style="color:var(--violet-300);font-size:1.1rem;flex-shrink:0;">account_tree</span>
        <input type="text" id="search-input" class="toolbar-input" placeholder="Search nodes…" style="flex:1;min-width:180px;">
        <button id="btn-search" class="btn">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">search</span>
            Search
        </button>
        <button id="btn-reset" class="btn btn-secondary">
            <span class="material-icons" style="font-size:1rem;vertical-align:middle;">refresh</span>
            Reset
        </button>
    </div>

    <!-- Tree panel -->
    <div style="flex:1;margin:0.75rem 1rem 1rem;overflow:hidden;">
        <div class="view-panel" style="height:100%;">
            <div class="panel-title">Tree View</div>
            <div id="tree-container" style="flex:1;overflow:auto;padding:0.75rem;"></div>
        </div>
    </div>

</div>

{% endblock %}
{% block scripts %}
<script src="/static/tree.js"></script>
{% endblock %}
