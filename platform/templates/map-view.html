{% extends "base.html" %}
{% block title_suffix %} - Bird View{% endblock %}
{% block content %}

<div style="display:flex;flex-direction:column;flex:1;overflow:hidden;margin:1rem;">
    <div class="view-panel" style="flex:1;">
        <div class="panel-title">
            <span class="material-icons" style="font-size:0.95rem;vertical-align:middle;margin-right:0.35rem;">satellite_alt</span>
            Bird View
        </div>
        <svg id="bird-canvas-full" width="100%" height="100%">
            <rect id="bird-viewport" x="0" y="0" width="50" height="50"
                  style="fill:none;stroke:#7c3aed;stroke-width:1.5;opacity:0.6;"/>
        </svg>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="/static/graph.js"></script>
{% endblock %}
