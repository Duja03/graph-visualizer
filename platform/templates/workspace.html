{% extends "base.html" %}
{% block title_suffix %} - Workspace{% endblock %}
{% block content %}

<div style="display:flex;flex:1;overflow:hidden;margin:1rem;gap:1rem;">

    <!-- Load New Graph -->
    <div class="view-panel" style="flex:1;max-width:340px;">
        <div class="panel-title">
            <span class="material-icons" style="font-size:0.95rem;vertical-align:middle;margin-right:0.35rem;">upload</span>
            Load New Graph
        </div>
        <div style="padding:1rem;display:flex;flex-direction:column;gap:0.85rem;overflow-y:auto;flex:1;">
            <select id="plugin-selector" class="toolbar-select" style="border-radius:0.75rem;">
            </select>
            <div id="plugin-params" class="plugin-params"></div>
            <button id="btn-load" class="btn" style="align-self:flex-start;">
                <span class="material-icons" style="font-size:1rem;vertical-align:middle;">play_arrow</span>
                Load Graph
            </button>
        </div>
    </div>

    <!-- Active Workspaces -->
    <div class="view-panel" style="flex:2;">
        <div class="panel-title">
            <span class="material-icons" style="font-size:0.95rem;vertical-align:middle;margin-right:0.35rem;">workspaces</span>
            Active Workspaces
        </div>
        <div id="workspace-list-container" style="padding:1rem;overflow-y:auto;flex:1;">
            <p class="empty-state">No workspaces loaded yet.</p>
        </div>
    </div>

</div>

{% endblock %}
{% block scripts %}
<script src="/static/workspace.js"></script>
{% endblock %}
